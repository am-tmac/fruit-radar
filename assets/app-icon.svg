<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3ad1c0"/>
      <stop offset="0.5" stop-color="#24c4b3"/>
      <stop offset="1" stop-color="#1bb2a4"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
    <filter id="appsh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.40"/>
    </filter>
    <filter id="marksh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="12" stdDeviation="14" flood-color="#0b3b38" flood-opacity="0.18"/>
    </filter>
    <!-- 白=保留 黑=挖空：果身圆 + 叶片，两者相交处自然留下「果梗」 -->
    <mask id="fruitHole">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="191" fill="#000"/>
      <path d="M 485 323 C 528 268 604 228 690 238 C 668 300 612 352 556 372 Z" fill="#000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="188" fill="#000" filter="url(#appsh)"/>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="#ffffff"/>

  <g clip-path="url(#squircle)">
    <circle cx="512" cy="512" r="344" fill="url(#teal)" mask="url(#fruitHole)" filter="url(#marksh)"/>
  </g>
</svg>
